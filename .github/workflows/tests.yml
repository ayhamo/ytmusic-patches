name: Tests

# On every push: the extension's JVM unit tests (the shared spec cases included), and spec/
# against the master copy in the YT Music Extension's public repo (scripts/check-spec.ps1).
# (push only: a pull request's branch is pushed here too, so pull_request would run it twice)
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Run the unit tests
        working-directory: bundle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }} # Morphe's Gradle plugin comes from GitHub Packages
        run: |
          chmod +x gradlew
          ./gradlew :extensions:extension:testDebugUnitTest --no-daemon --console=plain

      - name: Count the results
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          t = f = e = s = 0
          for p in glob.glob("bundle/extensions/extension/build/test-results/testDebugUnitTest/*.xml"):
              r = ET.parse(p).getroot()
              t += int(r.get("tests", 0)); f += int(r.get("failures", 0)); e += int(r.get("errors", 0)); s += int(r.get("skipped", 0))
          line = f"{t} tests: {t - f - e - s} passed, {f} failed, {e} errors, {s} skipped"
          print(line)
          open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a").write(line + "\n")
          EOF

      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: bundle/extensions/extension/build/reports/tests/testDebugUnitTest
          retention-days: 7

  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the master spec/ (the extension's public main)
        uses: actions/checkout@v4
        with:
          repository: ayhamo/vivimusic-automix
          ref: main
          path: master
          sparse-checkout: spec
          sparse-checkout-cone-mode: true

      - name: Compare spec/ with the master
        shell: pwsh
        run: ./scripts/check-spec.ps1 -Master master/spec
